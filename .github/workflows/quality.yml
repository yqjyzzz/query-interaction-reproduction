name: repository-quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装检查依赖
        run: python -m pip install -e ".[test]" Pillow
      - name: 执行完整检查
        run: python scripts/check_repository.py
